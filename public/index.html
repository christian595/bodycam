<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bodycam Dashboard</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0d0f14;
      --surface:   #161a23;
      --border:    #252b38;
      --accent:    #3b82f6;
      --accent-dim:#1d4ed8;
      --text:      #e2e8f0;
      --muted:     #64748b;
      --danger:    #ef4444;
      --radius:    12px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
    }

    /* ── Header ──────────────────────────────────────── */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(13, 15, 20, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
      display: flex;
      align-items: center;
      gap: 16px;
      height: 60px;
    }
    .header-icon { font-size: 22px; }
    header h1 {
      font-size: 17px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }
    header .subtitle {
      font-size: 13px;
      color: var(--muted);
      margin-left: auto;
    }
    #count-badge {
      background: var(--accent);
      color: #fff;
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 99px;
    }
    .live-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 0 0 rgba(34,197,94,.5);
      animation: pulse 2s infinite;
      flex-shrink: 0;
    }
    @keyframes pulse {
      0%   { box-shadow: 0 0 0 0 rgba(34,197,94,.5); }
      70%  { box-shadow: 0 0 0 8px rgba(34,197,94,0); }
      100% { box-shadow: 0 0 0 0 rgba(34,197,94,0); }
    }

    /* ── Main layout ─────────────────────────────────── */
    main { padding: 28px 24px; max-width: 1400px; margin: 0 auto; }

    /* ── Empty / loading states ──────────────────────── */
    #state-empty, #state-loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 100px 0;
      color: var(--muted);
    }
    #state-empty .icon, #state-loading .icon { font-size: 48px; }
    #state-empty p, #state-loading p { font-size: 15px; }
    #state-loading .spinner {
      width: 36px; height: 36px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Grid ────────────────────────────────────────── */
    #grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 20px;
    }

    /* ── Card ────────────────────────────────────────── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: border-color .2s, transform .2s;
      animation: fadeIn .35s ease both;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .card:hover {
      border-color: var(--accent);
      transform: translateY(-2px);
    }

    .card-photo {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 10;
      overflow: hidden;
      background: #0a0c10;
      cursor: zoom-in;
    }
    .card-photo img {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
      transition: transform .3s ease;
    }
    .card:hover .card-photo img { transform: scale(1.03); }
    .card-photo-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(0,0,0,.55) 0%, transparent 50%);
      pointer-events: none;
    }
    .card-ts-overlay {
      position: absolute;
      bottom: 8px; left: 10px;
      font-size: 11px;
      color: rgba(255,255,255,.75);
      font-variant-numeric: tabular-nums;
    }

    .card-body { padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; flex: 1; }

    .card-address {
      display: flex;
      align-items: flex-start;
      gap: 6px;
      font-size: 13px;
      font-weight: 500;
      line-height: 1.35;
    }
    .card-address .pin { font-size: 14px; flex-shrink: 0; margin-top: 1px; }
    .card-address a {
      color: var(--accent);
      text-decoration: none;
      word-break: break-word;
    }
    .card-address a:hover { text-decoration: underline; }

    .card-description {
      font-size: 13px;
      color: #94a3b8;
      line-height: 1.6;
      flex: 1;
    }

    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 10px;
      border-top: 1px solid var(--border);
    }
    .card-coords {
      font-size: 11px;
      color: var(--muted);
      text-decoration: none;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 75%;
    }
    .card-coords:hover { color: var(--accent); }
    .btn-delete {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 15px;
      opacity: .45;
      transition: opacity .15s;
      padding: 2px 4px;
      line-height: 1;
      color: var(--danger);
    }
    .btn-delete:hover { opacity: 1; }

    /* ── Lightbox ─────────────────────────────────────── */
    #lightbox {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.88);
      z-index: 999;
      align-items: center;
      justify-content: center;
      padding: 24px;
      cursor: zoom-out;
    }
    #lightbox.open { display: flex; }
    #lightbox img {
      max-width: 100%; max-height: 100%;
      border-radius: 8px;
      box-shadow: 0 0 60px rgba(0,0,0,.8);
      object-fit: contain;
    }
    #lightbox-close {
      position: absolute;
      top: 16px; right: 20px;
      background: rgba(255,255,255,.12);
      border: none;
      color: #fff;
      font-size: 20px;
      width: 36px; height: 36px;
      border-radius: 50%;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    #lightbox-close:hover { background: rgba(255,255,255,.25); }
  </style>
</head>
<body>

<header>
  <span class="header-icon">📷</span>
  <h1>Bodycam Dashboard</h1>
  <span id="count-badge">0</span>
  <div class="live-dot" title="Auto-refreshing"></div>
  <span class="subtitle" id="last-updated"></span>
</header>

<main>
  <div id="state-loading">
    <div class="spinner"></div>
    <p>Loading captures…</p>
  </div>

  <div id="state-empty" style="display:none">
    <span class="icon">🎥</span>
    <p>No captures yet. Upload from the iOS app to get started.</p>
  </div>

  <div id="grid"></div>
</main>

<!-- Lightbox -->
<div id="lightbox" role="dialog" aria-modal="true">
  <button id="lightbox-close" aria-label="Close">✕</button>
  <img id="lightbox-img" src="" alt="Full size capture" />
</div>

<script>
const REFRESH_MS = 15_000;

function mapsUrl(lat, lng) {
  return `https://www.google.com/maps?q=${lat},${lng}`;
}

function relativeTime(iso) {
  const diff = Date.now() - new Date(iso).getTime();
  const s = Math.floor(diff / 1000);
  if (s < 60)   return 'just now';
  const m = Math.floor(s / 60);
  if (m < 60)   return `${m}m ago`;
  const h = Math.floor(m / 60);
  if (h < 24)   return `${h}h ago`;
  const d = Math.floor(h / 24);
  return `${d}d ago`;
}

function absTime(iso) {
  return new Date(iso).toLocaleString(undefined, {
    month: 'short', day: 'numeric',
    hour: '2-digit', minute: '2-digit',
  });
}

function renderCard(c) {
  const card = document.createElement('div');
  card.className = 'card';
  card.dataset.id = c.id;

  card.innerHTML = `
    <div class="card-photo">
      <img src="${c.photoUrl}" alt="Capture" loading="lazy" />
      <div class="card-photo-overlay"></div>
      <span class="card-ts-overlay">${relativeTime(c.timestamp)}</span>
    </div>
    <div class="card-body">
      <div class="card-address">
        <span class="pin">📍</span>
        <a href="${mapsUrl(c.latitude, c.longitude)}" target="_blank" rel="noopener">
          ${escHtml(c.address)}
        </a>
      </div>
      <p class="card-description">${escHtml(c.description)}</p>
      <div class="card-footer">
        <button class="btn-delete" title="Delete capture" data-id="${c.id}">🗑</button>
      </div>
    </div>
  `;

  // Lightbox
  card.querySelector('.card-photo').addEventListener('click', () => openLightbox(c.photoUrl));

  // Delete
  card.querySelector('.btn-delete').addEventListener('click', async (e) => {
    e.stopPropagation();
    if (!confirm('Delete this capture?')) return;
    await fetch(`/api/captures/${c.id}`, { method: 'DELETE' });
    card.remove();
    updateCount();
  });

  return card;
}

function escHtml(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function updateCount() {
  const n = document.querySelectorAll('#grid .card').length;
  document.getElementById('count-badge').textContent = n;
  document.getElementById('state-empty').style.display = n === 0 ? 'flex' : 'none';
}

let knownIds = new Set();

async function loadCaptures(initial = false) {
  try {
    const res  = await fetch('/api/captures');
    const data = await res.json();

    document.getElementById('state-loading').style.display = 'none';
    document.getElementById('state-empty').style.display  = data.length === 0 ? 'flex' : 'none';

    const grid     = document.getElementById('grid');
    const incoming = new Set(data.map(c => c.id));

    // Remove cards no longer in the API response
    document.querySelectorAll('#grid .card').forEach(card => {
      if (!incoming.has(card.dataset.id)) card.remove();
    });

    // Prepend new cards (newest first — API already sorted)
    data.forEach((capture, i) => {
      if (!knownIds.has(capture.id)) {
        const card = renderCard(capture);
        card.style.animationDelay = `${i * 40}ms`;
        grid.prepend(card);
        knownIds.add(capture.id);
      }
    });

    // Make sure order matches API (reinsert all in order on initial load)
    if (initial) {
      grid.innerHTML = '';
      knownIds = new Set();
      data.forEach((capture, i) => {
        const card = renderCard(capture);
        card.style.animationDelay = `${i * 40}ms`;
        grid.appendChild(card);
        knownIds.add(capture.id);
      });
    }

    updateCount();

    const now = new Date();
    document.getElementById('last-updated').textContent =
      `Updated ${now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' })}`;

  } catch (err) {
    console.error('Failed to load captures:', err);
  }
}

// ── Lightbox ──────────────────────────────────────────────────────────────────
const lightbox     = document.getElementById('lightbox');
const lightboxImg  = document.getElementById('lightbox-img');
const lightboxClose = document.getElementById('lightbox-close');

function openLightbox(src) {
  lightboxImg.src = src;
  lightbox.classList.add('open');
}
function closeLightbox() {
  lightbox.classList.remove('open');
  lightboxImg.src = '';
}
lightbox.addEventListener('click', e => { if (e.target === lightbox) closeLightbox(); });
lightboxClose.addEventListener('click', closeLightbox);
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLightbox(); });

// ── Bootstrap ─────────────────────────────────────────────────────────────────
loadCaptures(true);
setInterval(() => loadCaptures(false), REFRESH_MS);
</script>
</body>
</html>
